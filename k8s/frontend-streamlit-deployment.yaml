apiVersion: apps/v1
kind: Deployment
metadata:
  name: metamind-frontend-streamlit
  namespace: metamind
  labels:
    app: metamind
    component: frontend-streamlit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metamind
      component: frontend-streamlit
  template:
    metadata:
      labels:
        app: metamind
        component: frontend-streamlit
    spec:
      containers:
      - name: frontend-streamlit
        image: metamind-frontend-streamlit:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
          name: http
        env:
        - name: API_BASE_URL
          value: "http://metamind-backend:8000"
        - name: STREAMLIT_SERVER_PORT
          value: "8501"
        - name: STREAMLIT_SERVER_ADDRESS
          value: "0.0.0.0"
        - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
          value: "false"
        - name: STREAMLIT_SERVER_HEADLESS
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3