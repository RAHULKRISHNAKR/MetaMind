apiVersion: v1
kind: Service
metadata:
  name: metamind-backend
  namespace: metamind
  labels:
    app: metamind
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: metamind
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: metamind-frontend-react
  namespace: metamind
  labels:
    app: metamind
    component: frontend-react
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: metamind
    component: frontend-react
---
apiVersion: v1
kind: Service
metadata:
  name: metamind-frontend-streamlit
  namespace: metamind
  labels:
    app: metamind
    component: frontend-streamlit
spec:
  type: ClusterIP
  ports:
  - port: 8501
    targetPort: 8501
    protocol: TCP
    name: http
  selector:
    app: metamind
    component: frontend-streamlit