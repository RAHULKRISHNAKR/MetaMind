apiVersion: apps/v1
kind: Deployment
metadata:
  name: metamind-frontend-react
  namespace: metamind
  labels:
    app: metamind
    component: frontend-react
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metamind
      component: frontend-react
  template:
    metadata:
      labels:
        app: metamind
        component: frontend-react
    spec:
      containers:
      - name: frontend-react
        image: metamind-frontend-react:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3